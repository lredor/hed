name: Build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  domain:
    name: Domain verification
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-java-maven
        with:
          cache-dependency-path: |
            pom.xml
            backend/hed-model/pom.xml
            backend/hed-model-edit/pom.xml
      - name: Build and test the model and edit modules
        id: domain_tests
        run: mvn -B -ntp verify
      - name: Test the coverage summary reporters
        run: python3 -m unittest discover -s tools/ci -p 'test_*.py'
      - name: Show domain test results
        if: ${{ always() && !cancelled() }}
        uses: mikepenz/action-junit-report@a16be3a69023e9bd7e748ede768b3282ea7b30ce # v6.7.1
        with:
          report_paths: backend/hed-model*/target/surefire-reports/TEST-*.xml
          check_name: Domain tests
          job_summary_text: |
            ## Domain tests

            ${{ steps.domain_tests.outcome == 'success' && 'All model and edit module tests completed.' || 'The build did not complete. Only available test reports are shown; consult the build log for tests that could not run.' }}
          detailed_summary: true
          job_summary: true
          include_passed: true
          include_skipped: true
          include_time_in_summary: true
          group_suite: true
          failed_summary_logs: true
          truncate_stack_traces: false
          # Native summaries also work with the read-only token on fork PRs.
          skip_annotations: true
          comment: false
          require_tests: ${{ steps.domain_tests.outcome == 'success' }}
          fail_on_failure: true
          fail_on_parse_error: true
      - name: Explain restricted contribution checks
        if: >-
          github.event_name == 'pull_request' &&
          (github.event.pull_request.head.repo.full_name != github.repository || github.actor == 'dependabot[bot]')
        run: |
          echo 'The full application build and browser verification are skipped for fork and Dependabot pull requests because they may require package credentials.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Before merging, validate the reviewed contribution on a trusted branch as described in doc/continuous-integration.md.' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload domain test reports
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: domain-test-reports
          path: backend/hed-model*/target/surefire-reports/
          if-no-files-found: warn
          retention-days: 7

  application:
    name: Full application build
    # Only repository-controlled code can use the optional package-read secret.
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-java-maven
        with:
          cache-dependency-path: |
            pom.xml
            backend/**/pom.xml
      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: '22.16.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked frontend dependencies
        working-directory: frontend
        env:
          GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN || github.token }}
        run: npm ci
      - name: Check and build the frontend and both user guides
        working-directory: frontend
        run: npm run build
      - name: Run frontend unit tests with coverage
        id: frontend_tests
        working-directory: frontend
        run: npm run test:coverage
      - name: Show frontend coverage
        run: >-
          python3 tools/ci/frontend_coverage_summary.py
          coverage/frontend/coverage-summary.json
          >> "$GITHUB_STEP_SUMMARY"
      - name: Show frontend unit test results
        if: ${{ always() && !cancelled() }}
        uses: mikepenz/action-junit-report@a16be3a69023e9bd7e748ede768b3282ea7b30ce # v6.7.1
        with:
          report_paths: test-results/frontend-unit/results.xml
          check_name: Frontend unit tests
          job_summary_text: |
            ## Frontend unit tests

            ${{ steps.frontend_tests.outcome == 'success' && 'All targeted frontend tests completed.' || 'Frontend verification did not complete successfully. Only available results are shown; consult the build and test logs if no tests could run.' }}
          detailed_summary: true
          job_summary: true
          include_passed: true
          include_skipped: true
          include_time_in_summary: true
          group_suite: true
          failed_summary_logs: true
          truncate_stack_traces: false
          skip_annotations: true
          comment: false
          require_tests: ${{ steps.frontend_tests.outcome == 'success' }}
          fail_on_failure: true
          fail_on_parse_error: true
      - name: Upload frontend coverage details
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: frontend-coverage
          path: coverage/frontend/
          if-no-files-found: warn
          retention-days: 7
      - name: Upload frontend test reports
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: frontend-test-reports
          path: test-results/frontend-unit/
          if-no-files-found: warn
          retention-days: 7
      - name: Build and test all application modules
        id: application_tests
        env:
          GH_PACKAGES_USERNAME: ${{ vars.GH_PACKAGES_USERNAME || github.repository_owner }}
          GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN || github.token }}
        run: mvn -B -ntp -s .github/maven-settings.xml -Papplication,coverage clean verify
      - name: Show application test results
        if: ${{ always() && !cancelled() }}
        uses: mikepenz/action-junit-report@a16be3a69023e9bd7e748ede768b3282ea7b30ce # v6.7.1
        with:
          report_paths: backend/**/target/surefire-reports/TEST-*.xml
          check_name: Application tests
          job_summary_text: |
            ## Application tests

            ${{ steps.application_tests.outcome == 'success' && 'All application module tests completed.' || 'The build did not complete. Only available test reports are shown; consult the build log for tests that could not run.' }}
          detailed_summary: true
          job_summary: true
          include_passed: true
          include_skipped: true
          include_time_in_summary: true
          group_suite: true
          failed_summary_logs: true
          truncate_stack_traces: false
          skip_annotations: true
          comment: false
          require_tests: ${{ steps.application_tests.outcome == 'success' }}
          fail_on_failure: true
          fail_on_parse_error: true
      - name: Check packaged frontend and user guides
        run: |
          application_jars=(backend/hed-application/target/hed-application-*.jar)
          jar --list --file "${application_jars[0]}" > "$RUNNER_TEMP/application-contents.txt"
          for entry in \
            BOOT-INF/classes/static/index.html \
            BOOT-INF/classes/static/help/en/index.html \
            BOOT-INF/classes/static/help/fr/index.html
          do
            grep --fixed-strings --line-regexp "$entry" "$RUNNER_TEMP/application-contents.txt"
          done
      - name: Show Java coverage
        run: >-
          python3 tools/ci/jacoco_summary.py
          backend/hed-coverage/target/site/jacoco-aggregate/jacoco.xml
          >> "$GITHUB_STEP_SUMMARY"
      - name: Upload Java coverage details
        if: ${{ always() && !cancelled() && steps.application_tests.outcome == 'success' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: java-coverage
          path: backend/hed-coverage/target/site/jacoco-aggregate/
          if-no-files-found: error
          retention-days: 7
      - name: Upload Java test reports
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: application-test-reports
          path: backend/**/target/surefire-reports/
          if-no-files-found: warn
          retention-days: 7
      - name: Upload the executable application
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: hed-application-${{ github.sha }}
          path: backend/hed-application/target/hed-application-*.jar
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  image:
    name: Container image
    needs: application
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Download the tested application
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: hed-application-${{ github.sha }}
          path: ${{ runner.temp }}/hed-application
      - name: Build the runtime image from the verified JAR
        env:
          REVISION: ${{ github.sha }}
        run: |
          docker build --platform linux/amd64 --file Dockerfile.runtime \
            --label "org.opencontainers.image.revision=$REVISION" \
            --tag "ghcr.io/lredor/hed:sha-$REVISION" \
            --tag ghcr.io/lredor/hed:latest \
            "$RUNNER_TEMP/hed-application"
      - name: Start the image and database without build credentials
        env:
          HED_IMAGE: ghcr.io/lredor/hed:latest
        run: |
          docker compose -p hed-image-ci -f compose.run.yaml up -d --wait --wait-timeout 180
          curl --fail --silent --show-error http://localhost:8080/actuator/health/readiness
          curl --fail --silent --show-error http://localhost:8080/help/en/index.html --output /dev/null
          curl --fail --silent --show-error http://localhost:8080/help/fr/index.html --output /dev/null
          {
            echo '## Container image verification'
            echo
            echo 'The Linux amd64 runtime image started successfully with PostgreSQL using compose.run.yaml and no package-build credentials.'
            echo 'Readiness and both bundled user guides responded successfully. This image will be reused for publication after the other checks pass on master.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Collect container logs and stop the isolated installation
        if: ${{ always() }}
        run: |
          mkdir -p container-results
          docker compose -p hed-image-ci -f compose.run.yaml logs --no-color > container-results/startup.log 2>&1 || true
          docker compose -p hed-image-ci -f compose.run.yaml down --volumes
      - name: Upload container logs
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: container-logs
          path: container-results/
          retention-days: 7
      - name: Save the tested runtime image
        run: docker image save ghcr.io/lredor/hed:latest | gzip -1 > "$RUNNER_TEMP/hed-image.tar.gz"
      - name: Upload the tested runtime image
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: hed-image-${{ github.sha }}
          path: ${{ runner.temp }}/hed-image.tar.gz
          compression-level: 0
          retention-days: 1

  publish:
    name: Publish Docker image
    needs: [domain, application, playwright, image]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master' && github.repository == 'lredor/hed'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      packages: write
    steps:
      - name: Download the tested runtime image
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: hed-image-${{ github.sha }}
          path: ${{ runner.temp }}/hed-image
      - name: Load the tested image without rebuilding
        env:
          REVISION: ${{ github.sha }}
        run: |
          docker image load --input "$RUNNER_TEMP/hed-image/hed-image.tar.gz"
          docker tag ghcr.io/lredor/hed:latest "ghcr.io/lredor/hed:sha-$REVISION"
      - name: Publish to GitHub Container Registry
        env:
          PUBLISH_TOKEN: ${{ github.token }}
          REGISTRY_USER: ${{ github.actor }}
          REVISION: ${{ github.sha }}
        run: |
          printf '%s' "$PUBLISH_TOKEN" | docker login ghcr.io --username "$REGISTRY_USER" --password-stdin
          trap 'docker logout ghcr.io' EXIT
          docker push "ghcr.io/lredor/hed:sha-$REVISION"
          docker push ghcr.io/lredor/hed:latest
          {
            echo '## Docker image'
            echo
            echo 'Published `ghcr.io/lredor/hed:latest` and `ghcr.io/lredor/hed:sha-'"$REVISION"'` (linux/amd64).'
            echo 'After the first publication, the owner must make the hed package Public in GitHub package settings to enable anonymous pulls.'
            echo 'Users can then start it with compose.run.yaml without building or supplying a GitHub token.'
          } >> "$GITHUB_STEP_SUMMARY"

  playwright:
    name: Playwright (${{ matrix.language }})
    needs: application
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - locale: en_GB
            language: English
          - locale: fr_FR
            language: French
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: hed_e2e
          POSTGRES_USER: hed
          POSTGRES_PASSWORD: hed-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hed -d hed_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      CI: 'true'
      DATABASE_URL: jdbc:postgresql://127.0.0.1:5432/hed_e2e
      DATABASE_USER: hed
      DATABASE_PASSWORD: hed-ci
      HED_BASE_URL: http://127.0.0.1:8080
      HED_LOCALE: ${{ matrix.locale }}
      HED_TEST_LOCALE: ${{ matrix.locale }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: '21'
          overwrite-settings: false
      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: '22.16.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Download the application built in this workflow
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: hed-application-${{ github.sha }}
          path: ${{ runner.temp }}/hed-application
      - name: Install locked test dependencies
        working-directory: frontend
        env:
          GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN || github.token }}
        run: npm ci
      - name: Install Google Chrome and browser dependencies
        working-directory: frontend
        run: npx --no-install playwright install --with-deps chrome
      - name: Start the application and wait for readiness
        timeout-minutes: 5
        run: |
          application_jars=("$RUNNER_TEMP"/hed-application/hed-application-*.jar)
          nohup java -Xmx1g -jar "${application_jars[0]}" > "$RUNNER_TEMP/hed-application.log" 2>&1 &
          application_pid=$!
          echo "$application_pid" > "$RUNNER_TEMP/hed-application.pid"
          for (( attempt=0; attempt<90; attempt++ )); do
            if ! kill -0 "$application_pid" 2>/dev/null; then
              cat "$RUNNER_TEMP/hed-application.log"
              exit 1
            fi
            if curl --fail --silent --max-time 2 --output /dev/null "$HED_BASE_URL/actuator/health/readiness"; then
              exit 0
            fi
            sleep 2
          done
          tail -n 100 "$RUNNER_TEMP/hed-application.log"
          echo 'Application readiness timed out.' >&2
          exit 1
      - name: Run all browser workflows in ${{ matrix.language }}
        id: playwright_tests
        working-directory: frontend
        run: npm test
      - name: Show Playwright test results
        if: ${{ always() && !cancelled() }}
        uses: mikepenz/action-junit-report@a16be3a69023e9bd7e748ede768b3282ea7b30ce # v6.7.1
        with:
          report_paths: test-results/${{ matrix.locale }}/results.xml
          check_name: Playwright (${{ matrix.language }})
          job_summary_text: |
            ## Playwright (${{ matrix.language }})

            ${{ steps.playwright_tests.outcome == 'success' && 'All browser workflows completed.' || 'Browser verification did not complete successfully. Only available results are shown; consult the setup and application logs if no tests could run.' }}
          detailed_summary: true
          job_summary: true
          include_passed: true
          include_skipped: true
          include_time_in_summary: true
          group_suite: true
          failed_summary_logs: true
          truncate_stack_traces: false
          skip_annotations: true
          comment: false
          require_tests: ${{ steps.playwright_tests.outcome == 'success' }}
          fail_on_failure: true
          fail_on_parse_error: true
      - name: Stop the test application and collect its logs
        if: ${{ always() }}
        run: |
          if [ -f "$RUNNER_TEMP/hed-application.pid" ]; then
            read -r application_pid < "$RUNNER_TEMP/hed-application.pid"
            if kill -0 "$application_pid" 2>/dev/null; then
              kill "$application_pid" 2>/dev/null || true
            fi
          fi
          mkdir -p "test-results/$HED_TEST_LOCALE"
          if [ -f "$RUNNER_TEMP/hed-application.log" ]; then
            cp "$RUNNER_TEMP/hed-application.log" "test-results/$HED_TEST_LOCALE/application.log"
          fi
      - name: Upload browser reports, traces and application logs
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: playwright-${{ matrix.locale }}
          path: |
            playwright-report/${{ matrix.locale }}/
            test-results/${{ matrix.locale }}/
          if-no-files-found: warn
          retention-days: 7
