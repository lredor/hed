name: CheckFormatting

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  formatting:
    name: Source formatting
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-java-maven
        with:
          cache-dependency-path: tools/codegen/pom.xml
      - name: Check Java formatting
        run: >-
          mvn -B -f tools/codegen/pom.xml compile exec:java
          -Dexec.mainClass=hed.codegen.SourceFormatting
          "-Dexec.args=--check ."
      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        if: hashFiles('frontend/.prettierrc') != ''
        with:
          node-version: '22.16.0'
          package-manager-cache: false
      - name: Check frontend formatting
        if: hashFiles('frontend/.prettierrc') != ''
        run: >-
          npm exec --yes --package=prettier@2.7.1 -- prettier --check
          --config frontend/.prettierrc
          "frontend/src/**/*.{ts,tsx,css}" "frontend/e2e/**/*.ts"
          "frontend/tests/**/*.{ts,tsx}"
          "frontend/scripts/**/*.mjs" "frontend/*.ts" frontend/index.html
