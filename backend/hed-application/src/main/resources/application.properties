management.endpoint.health.group.readiness.include=readinessState,db
management.endpoint.health.probes.enabled=true
management.endpoints.web.exposure.include=health,info
management.health.elasticsearch.enabled=false
server.port=8080
sirius.components.cors.allowedCredentials=true
sirius.components.cors.allowedOriginPatterns=${HED_ALLOWED_ORIGINS:http://localhost:5173}
sirius.web.enabled=*
spring.application.name=Home Electrical Designer
spring.data.elasticsearch.repositories.enabled=false
spring.datasource.password=${DATABASE_PASSWORD:hed}
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5437/hed}
spring.datasource.username=${DATABASE_USER:hed}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.liquibase.change-log=classpath:db/db.changelog-master.xml
spring.mvc.locale=${HED_LOCALE:en_GB}
spring.mvc.pathmatch.matching-strategy=ANT_PATH_MATCHER
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB
