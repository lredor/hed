# Standalone installation: no source build, package credentials or repository checkout.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: hed
      POSTGRES_USER: hed
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-hed-local}
    volumes:
      - hed-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hed -d hed"]
      interval: 5s
      timeout: 5s
      retries: 15

  application:
    image: ${HED_IMAGE:-ghcr.io/lredor/hed:latest}
    platform: linux/amd64
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/hed
      DATABASE_USER: hed
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-hed-local}
      HED_LOCALE: ${HED_LOCALE:-en_GB}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  hed-postgres-data:
