services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: hed
      POSTGRES_USER: hed
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-hed-local}
    ports:
      - "127.0.0.1:5437:5432"
    volumes:
      - hed-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hed -d hed"]
      interval: 5s
      timeout: 5s
      retries: 15

  application:
    image: home-electrical-designer:dev
    build:
      context: .
      args:
        GITHUB_ACTOR: ${GITHUB_ACTOR:-lredor}
      secrets:
        - github_packages_token
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/hed
      DATABASE_USER: hed
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-hed-local}
      HED_LOCALE: ${HED_LOCALE:-en_GB}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

secrets:
  github_packages_token:
    environment: GH_PACKAGES_TOKEN

volumes:
  hed-postgres-data:
